name: Build v2 site

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages from sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python build.py
      - name: Commit changes
        run: |
          git config user.name "auto-build"
          git config user.email "auto-build@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "auto: rebuild v2" && git push)